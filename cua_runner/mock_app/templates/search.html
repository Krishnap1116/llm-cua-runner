{% extends "base.html" %}
{% block content %}
<table class="panel">
<tr><td class="row">
<form method="get" action="/search">
  <label for="q">Member ID or Name</label>
  <input type="text" id="q" name="q" value="{{ query }}">
  <button type="submit">Search</button>
</form>
<form method="post" action="/logout" style="display:inline">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit">Log Out</button>
</form>
</td></tr>
{% if searched %}
<tr><td class="row">
{% if results %}
<table class="results">
  <tr><td class="hdr">Name</td><td class="hdr">Member ID</td><td class="hdr">Status</td></tr>
  {% for r in results %}
  <tr>
    <td><a href="/member/{{ r.id }}">{{ r.name }}</a></td>
    <td>{{ r.id }}</td>
    <td>{{ r.status }}</td>
  </tr>
  {% endfor %}
</table>
{% else %}
<div role="alert" class="flash">No member found matching "{{ query }}"</div>
{% endif %}
</td></tr>
{% endif %}
</table>
{% endblock %}
